# Model chains per stage: first model is tried first; on 404 / repeated 429-5xx / invalid JSON twice, the next is used.
# Verified against a live probe on 2026-11-06 with this account's NVIDIA key: many catalogue-listed models
# return 404 or time out, so only these two are configured. Re-probe when switching keys or providers.
base_url: https://integrate.api.nvidia.com/v1
api_key_env: NVIDIA_API_KEY
rpm: 40
concurrency: 8
timeout_s: 120
max_retries: 3
backoff_base_s: 2.0
max_tokens: 4096          # reasoning models spend tokens thinking before the JSON
votes: 1
vote_temperature: 0.7
stages:
  bible:    {models: [nvidia/nemotron-3-ultra-550b-a55b, nvidia/nemotron-3.5-lightning-30b-a3b], temperature: 0.2}
  tagger:   {models: [nvidia/nemotron-3-ultra-550b-a55b, nvidia/nemotron-3.5-lightning-30b-a3b], temperature: 0.2}
  stitcher: {models: [nvidia/nemotron-3-ultra-550b-a55b, nvidia/nemotron-3.5-lightning-30b-a3b], temperature: 0.3}
  judge:    {models: [nvidia/nemotron-3-ultra-550b-a55b, nvidia/nemotron-3.5-lightning-30b-a3b], temperature: 0.0}
  hook3s:   {models: [nvidia/nemotron-3.5-lightning-30b-a3b, nvidia/nemotron-3-ultra-550b-a55b], temperature: 0.0}
  refine:   {models: [nvidia/nemotron-3-ultra-550b-a55b, nvidia/nemotron-3.5-lightning-30b-a3b], temperature: 0.0}
  pairwise: {models: [nvidia/nemotron-3-ultra-550b-a55b, nvidia/nemotron-3.5-lightning-30b-a3b], temperature: 0.0}
system_prefix: {}
