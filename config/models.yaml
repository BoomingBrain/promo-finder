# Model chains per stage: first model is tried first; the next is used on 404/4xx, repeated 5xx/timeouts or invalid JSON twice. A 429 waits and retries the SAME model.
# Verified against a live probe on 2026-11-06 with this account's NVIDIA key: many catalogue-listed models
# return 404 or time out. Re-probed 2026-11-07: Ultra, GLM-5.3-flash, DeepSeek-v4.1-flash, Mistral-Large-4 answer. Re-probe when switching keys or providers.
base_url: https://integrate.api.nvidia.com/v1
api_key_env: NVIDIA_API_KEY
rpm: 40
concurrency: 4            # was 8; fewer 429s on the free tier
timeout_s: 120
max_retries: 3
backoff_base_s: 2.0
rate_limit_retries: 10    # on 429, wait (2,4,8..60 s) and retry the SAME model; never downgrade to a weaker one
rate_limit_backoff_max_s: 60
max_tokens: 4096          # reasoning models spend tokens thinking before the JSON
votes: 1
vote_temperature: 0.7
# 2026-11-07: GLM-5.3-flash leads judge/hook3s/refine/pairwise — in a 10-pair both-orders test it agreed with itself 9/10
# with ~no first-position bias (Ultra 5/5 but rate-limited, DeepSeek 7/10, Mistral-Large-4 5/10). The small
# nemotron-3.5-lightning model is no longer in any chain (ai-log #12).
stages:
  bible:    {models: [nvidia/nemotron-3-ultra-550b-a55b, z-ai/glm-5.3-flash], temperature: 0.2}
  tagger:   {models: [nvidia/nemotron-3-ultra-550b-a55b, z-ai/glm-5.3-flash], temperature: 0.2}
  stitcher: {models: [nvidia/nemotron-3-ultra-550b-a55b, z-ai/glm-5.3-flash], temperature: 0.3}
  judge:    {models: [z-ai/glm-5.3-flash, nvidia/nemotron-3-ultra-550b-a55b], temperature: 0.0}
  hook3s:   {models: [z-ai/glm-5.3-flash, nvidia/nemotron-3-ultra-550b-a55b], temperature: 0.0}
  refine:   {models: [z-ai/glm-5.3-flash, nvidia/nemotron-3-ultra-550b-a55b], temperature: 0.0}
  pairwise: {models: [z-ai/glm-5.3-flash, nvidia/nemotron-3-ultra-550b-a55b], temperature: 0.0}
system_prefix: {}
