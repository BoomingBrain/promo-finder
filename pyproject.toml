[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promofinder"
version = "0.1.0"
description = "Find ranked promo clips in timestamped microdrama screenplays"
requires-python = ">=3.11"
dependencies = ["openai>=1.40", "pydantic>=2.6", "pyyaml>=6.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["promofinder", "promofinder.readers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
